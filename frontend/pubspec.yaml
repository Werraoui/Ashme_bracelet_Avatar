name: avatar_monitoring
description: AVATAR OS — Asthma monitoring Flutter application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.0

  # Local storage (JWT token, user session)
  shared_preferences: ^2.2.3

  # Local push notifications
  flutter_local_notifications: ^17.2.1+2

  # Logging
  logger: ^2.3.0

  # Timezone support (required by flutter_local_notifications)
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
